services:
  conduit-frontend:
    build:
      context: ../conduit-frontend
      dockerfile: ../conduit-docker/conduit-frontend/Dockerfile
    image: conduit:local
    container_name: conduit
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - conduit-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  conduit-data: