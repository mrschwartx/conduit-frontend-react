services:
  conduit-frontend:
    build:
      context: ../conduit-frontend
      dockerfile: ../conduit-docker/conduit-frontend-react/Dockerfile
    image: conduit-frontend:local
    container_name: conduit-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://host.docker.internal:8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
