name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conduit-quality:
    name: conduit code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:ui
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: conduit-frontend/coverage
          retention-days: 7

  conduit-build:
    name: conduit code build
    runs-on: ubuntu-latest
    needs: conduit-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: conduit-frontend/dist
          retention-days: 1

  conduit-e2e-browser:
    name: conduit end-to-end browser
    runs-on: ubuntu-latest
    needs: conduit-build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: conduit-frontend/dist
      - run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: conduit-frontend/playwright-report
          retention-days: 7

  conduit-docker:
    name: conduit docker container
    runs-on: ubuntu-latest
    needs: conduit-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: conduit-frontend
          file: conduit-docker/conduit-frontend-react/Dockerfile
          load: true
          tags: conduit-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start mock API
        run: |
          MOCK_API_HOST=0.0.0.0 MOCK_API_PORT=8080 nohup node conduit-frontend/e2e/support/mock-api.mjs > mock-api.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health | grep -q OK; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run container
        run: |
          docker run -d --name conduit-frontend -p 3000:3000 \
            --add-host host.docker.internal:host-gateway \
            conduit-frontend:ci
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ping | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          docker logs conduit-frontend
          exit 1
      - name: Check pages
        run: |
          for path in / /login /register /settings /editor /editor/sample /article/sample /profile/sample /profile/sample/favorites; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done
      - name: Check API proxy
        run: curl -fsS http://localhost:3000/api/v1/tags | grep -q '"tags"'
      - name: Show logs on failure
        if: failure()
        run: docker logs conduit-frontend
