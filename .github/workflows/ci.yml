name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Conduit commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  conduit-quality:
    name: Conduit quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-nextjs/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture rules
        run: npm run test:architecture
      - name: Unit tests
        run: npm run test:unit
      - name: UI tests
        run: npm run test:ui
      - name: Integration tests
        run: npm run test:integration
      - name: Testing coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: conduit-nextjs/coverage
          retention-days: 7

  conduit-build:
    name: Conduit build
    runs-on: ubuntu-latest
    needs: conduit-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-nextjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-nextjs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload standalone build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: conduit-nextjs/.next
          include-hidden-files: true
          retention-days: 1

  conduit-e2e-api:
    name: Conduit end-to-end api
    runs-on: ubuntu-latest
    needs: conduit-build
    timeout-minutes: 15
    defaults:
      run:
        working-directory: conduit-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-nextjs/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: conduit-nextjs/.next
      - name: Run e2e suite
        run: npx vitest run --config vitest.e2e.config.mts

  conduit-e2e-browser:
    name: Conduit end-to-end browser
    runs-on: ubuntu-latest
    needs: conduit-build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conduit-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conduit-nextjs/package-lock.json
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: conduit-nextjs/.next
      - name: Prepare standalone assets
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Run browser tests
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: conduit-nextjs/playwright-report
          retention-days: 7

  conduit-docker:
    name: Conduit docker container
    runs-on: ubuntu-latest
    needs: conduit-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: conduit-nextjs
          file: conduit-docker/conduit-nextjs/Dockerfile
          load: true
          tags: conduit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run -d --name conduit -p 3000:3000 conduit:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ping | grep -q OK; then
              exit 0
            fi
            sleep 2
          done
          docker logs conduit
          exit 1

      - name: Check pages
        run: |
          for path in / /login /register /settings /editor /editor/sample /article/sample /profile/sample /profile/sample/favorites; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done

      - name: Show logs on failure
        if: failure()
        run: docker logs conduit